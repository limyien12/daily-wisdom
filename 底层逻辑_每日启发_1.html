<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>底层逻辑 · 每日启发</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1a1a;
    --paper: #f7f3ed;
    --warm: #c8a96e;
    --rust: #b5533c;
    --sage: #4a7c59;
    --mist: #e8e2d9;
    --deep: #2c3e50;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Noto Sans SC', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }
  .app {
    max-width: 720px;
    margin: 0 auto;
    padding: 40px 24px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header { text-align: center; margin-bottom: 48px; }
  .book-badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 300;
    letter-spacing: 4px;
    color: var(--warm);
    margin-bottom: 12px;
    padding: 4px 16px;
    border: 1px solid var(--warm);
  }
  header h1 {
    font-family: 'Noto Serif SC', serif;
    font-size: 28px;
    font-weight: 700;
    color: var(--ink);
    letter-spacing: 2px;
  }
  header h1 span { color: var(--rust); }
  .date-display { margin-top: 12px; font-size: 13px; color: #888; font-weight: 300; letter-spacing: 2px; }
  .stats-bar { display: flex; gap: 1px; margin-bottom: 32px; background: var(--mist); overflow: hidden; }
  .stat-item { flex: 1; background: white; padding: 14px; text-align: center; }
  .stat-num { font-family: 'Noto Serif SC', serif; font-size: 22px; font-weight: 700; color: var(--rust); }
  .stat-label { font-size: 11px; color: #999; margin-top: 2px; letter-spacing: 1px; }
  .story-card {
    background: white;
    border-radius: 2px;
    overflow: hidden;
    box-shadow: 0 2px 40px rgba(0,0,0,0.08), 0 0 0 1px rgba(0,0,0,0.04);
    margin-bottom: 32px;
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.4s ease, transform 0.4s ease;
  }
  .story-card.visible { opacity: 1; transform: translateY(0); }
  .story-card.fade-out { opacity: 0; transform: translateY(-10px); }
  .card-header {
    padding: 28px 36px 20px;
    border-bottom: 1px solid var(--mist);
    display: flex;
    align-items: flex-start;
    gap: 20px;
  }
  .chapter-tag {
    flex-shrink: 0;
    background: var(--ink);
    color: white;
    font-size: 11px;
    letter-spacing: 2px;
    padding: 4px 10px;
    font-weight: 500;
    margin-top: 4px;
  }
  .story-title { font-family: 'Noto Serif SC', serif; font-size: 22px; font-weight: 700; color: var(--ink); line-height: 1.4; }
  .card-body { padding: 28px 36px; }
  .story-narrative { font-family: 'Noto Serif SC', serif; font-size: 16px; line-height: 2; color: #333; margin-bottom: 24px; }
  .story-narrative p { text-indent: 2em; margin-bottom: 12px; }
  .story-narrative .hl { color: var(--rust); font-weight: 600; }
  .wisdom-block {
    border-left: 3px solid var(--warm);
    padding: 16px 20px;
    background: #fdf9f3;
    margin: 24px 0;
    position: relative;
  }
  .wisdom-text { font-family: 'Noto Serif SC', serif; font-size: 15px; font-style: italic; color: var(--deep); line-height: 1.8; }
  .application-section { background: var(--mist); padding: 20px 24px; border-top: 2px solid var(--warm); }
  .application-label { font-size: 10px; letter-spacing: 3px; font-weight: 500; color: var(--warm); margin-bottom: 8px; text-transform: uppercase; }
  .application-text { font-size: 14px; line-height: 1.8; color: #444; }
  .reflection-prompt { background: var(--ink); color: white; padding: 20px 24px; }
  .reflection-label { font-size: 10px; letter-spacing: 3px; color: var(--warm); margin-bottom: 8px; text-transform: uppercase; }
  .reflection-text { font-family: 'Noto Serif SC', serif; font-size: 14px; line-height: 1.8; color: #ddd; }
  .nav-section { display: flex; gap: 12px; margin-bottom: 32px; }
  .nav-btn {
    flex: 1; padding: 14px; border: 1px solid rgba(0,0,0,0.15);
    background: white; cursor: pointer;
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 13px; letter-spacing: 1px; color: var(--ink);
    transition: all 0.2s;
  }
  .nav-btn:hover { background: var(--ink); color: white; border-color: var(--ink); }
  .nav-btn.primary { background: var(--rust); color: white; border-color: var(--rust); }
  .nav-btn.primary:hover { background: #9a4532; }
  .progress-section { text-align: center; margin-bottom: 32px; }
  .progress-label { font-size: 11px; letter-spacing: 2px; color: #999; margin-bottom: 12px; text-transform: uppercase; }
  .dots { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; max-width: 400px; margin: 0 auto; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--mist); border: 1px solid #ccc; transition: all 0.3s; cursor: pointer; }
  .dot.read { background: var(--sage); border-color: var(--sage); }
  .dot.current { background: var(--rust); border-color: var(--rust); transform: scale(1.3); }
  footer { text-align: center; padding: 20px 0; font-size: 12px; color: #aaa; letter-spacing: 1px; margin-top: auto; }
  @media (max-width: 480px) {
    .app { padding: 24px 16px; }
    .card-header { padding: 20px; flex-direction: column; gap: 10px; }
    .card-body { padding: 20px; }
    .story-title { font-size: 18px; }
    .story-narrative { font-size: 15px; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="book-badge">底层逻辑 · 刘润</div>
    <h1>每日<span>启发</span></h1>
    <div class="date-display" id="dateDisplay"></div>
  </header>
  <div class="stats-bar">
    <div class="stat-item"><div class="stat-num" id="readCount">0</div><div class="stat-label">已读故事</div></div>
    <div class="stat-item"><div class="stat-num" id="totalCount">20</div><div class="stat-label">全部故事</div></div>
    <div class="stat-item"><div class="stat-num" id="streakCount">1</div><div class="stat-label">连续天数</div></div>
  </div>
  <div class="story-card" id="storyCard">
    <div class="card-header">
      <div class="chapter-tag" id="chapterTag"></div>
      <div class="story-title" id="storyTitle"></div>
    </div>
    <div class="card-body">
      <div class="story-narrative" id="storyNarrative"></div>
      <div class="wisdom-block"><div class="wisdom-text" id="wisdomText"></div></div>
    </div>
    <div class="application-section">
      <div class="application-label">职场应用</div>
      <div class="application-text" id="applicationText"></div>
    </div>
    <div class="reflection-prompt">
      <div class="reflection-label">今日反思</div>
      <div class="reflection-text" id="reflectionText"></div>
    </div>
  </div>
  <div class="nav-section">
    <button class="nav-btn" id="prevBtn">← 上一则</button>
    <button class="nav-btn primary" id="nextBtn">下一则 →</button>
  </div>
  <div class="progress-section">
    <div class="progress-label">故事进度</div>
    <div class="dots" id="dotsContainer"></div>
  </div>
  <footer>《底层逻辑》刘润 · 每天一则，改变思维</footer>
</div>

<script>

var currentIndex = 0;
var readStories = [];
var streak = 1;

try {
  var saved = localStorage.getItem('dlljReadStories');
  if (saved) readStories = JSON.parse(saved);
  var savedStreak = localStorage.getItem('dlljStreak');
  if (savedStreak) streak = parseInt(savedStreak);
  var today = new Date().toDateString();
  var lastVisit = localStorage.getItem('dlljLastVisit');
  if (lastVisit !== today) {
    var yesterday = new Date();
    yesterday.setDate(yesterday.getDate() - 1);
    if (lastVisit === yesterday.toDateString()) {
      streak += 1;
    } else {
      streak = 1;
    }
    localStorage.setItem('dlljStreak', streak);
    localStorage.setItem('dlljLastVisit', today);
  }
} catch(e) {}

function getDayOfYear() {
  var now = new Date();
  var start = new Date(now.getFullYear(), 0, 0);
  var diff = now - start;
  return Math.floor(diff / (1000 * 60 * 60 * 24));
}

currentIndex = getDayOfYear() % stories.length;

function formatDate() {
  var now = new Date();
  var days = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
  return now.getFullYear() + '年' + (now.getMonth()+1) + '月' + now.getDate() + '日 ' + days[now.getDay()];
}

function markAsRead(index) {
  if (readStories.indexOf(index) === -1) {
    readStories.push(index);
    try { localStorage.setItem('dlljReadStories', JSON.stringify(readStories)); } catch(e) {}
  }
}

function renderDots() {
  var container = document.getElementById('dotsContainer');
  container.innerHTML = '';
  for (var i = 0; i < stories.length; i++) {
    var dot = document.createElement('div');
    dot.className = 'dot';
    if (readStories.indexOf(i) !== -1) dot.className += ' read';
    if (i === currentIndex) dot.className += ' current';
    (function(idx) {
      dot.onclick = function() { goToStory(idx); };
    })(i);
    container.appendChild(dot);
  }
}

function renderStats() {
  document.getElementById('readCount').textContent = readStories.length;
  document.getElementById('streakCount').textContent = streak;
}

function renderStory(index) {
  var story = stories[index];
  document.getElementById('chapterTag').textContent = story.chapter;
  document.getElementById('storyTitle').textContent = story.title;
  var narrativeEl = document.getElementById('storyNarrative');
  narrativeEl.innerHTML = '';
  for (var i = 0; i < story.paragraphs.length; i++) {
    var p = document.createElement('p');
    p.innerHTML = story.paragraphs[i];
    narrativeEl.appendChild(p);
  }
  document.getElementById('wisdomText').textContent = story.wisdom;
  document.getElementById('applicationText').textContent = story.application;
  document.getElementById('reflectionText').textContent = story.reflection;
  markAsRead(index);
  renderDots();
  renderStats();
}

function goToStory(index) {
  var card = document.getElementById('storyCard');
  card.classList.add('fade-out');
  setTimeout(function() {
    currentIndex = index;
    renderStory(currentIndex);
    card.classList.remove('fade-out');
    card.classList.add('visible');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }, 300);
}

document.getElementById('prevBtn').addEventListener('click', function() {
  goToStory((currentIndex - 1 + stories.length) % stories.length);
});
document.getElementById('nextBtn').addEventListener('click', function() {
  goToStory((currentIndex + 1) % stories.length);
});

document.getElementById('dateDisplay').textContent = formatDate();
renderStory(currentIndex);
setTimeout(function() {
  document.getElementById('storyCard').classList.add('visible');
}, 100);

})();
